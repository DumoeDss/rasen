version: 2
id: builtin:full-feature
sourceId: package:full-feature
name: full-feature
description: >-
  Full feature delivery: office hours, proposal, apply, a conditional six-member
  expert FanOut/Join, bounded ReviewCycle, then ship, retain, and archive.
inputs: []
artifacts: []
outcomes: [approved, rejected, experts-failed, completed]
limits: { maxActions: 128, budget: 128 }
declarations:
  - id: review-cycle-body
    kind: Composite
    provenance: built-in
    inputs:
      - { name: start, type: ecp/control }
    artifacts: []
    outcomes: [clean, needs_fix]
    graph:
      nodes:
        - id: review
          kind: AtomicStage
          capability: { id: skill:rasen-review, version: sha256:281717f5e3164dca91e21d9329ae812b8ee1263f656d605ef8b1d3d6bba0c7fc }
          execution: { version: 1, role: reviewer, workspace: { access: read } }
          reviewCyclePhase: review
        - id: triage
          kind: AtomicStage
          capability: { id: skill:rasen-review, version: sha256:281717f5e3164dca91e21d9329ae812b8ee1263f656d605ef8b1d3d6bba0c7fc }
          execution: { version: 1, role: reviewer, workspace: { access: read } }
          reviewCyclePhase: triage
        - id: fix
          kind: AtomicStage
          capability: { id: skill:rasen-review-fix, version: sha256:fa102c0d009739407f98afffff477d336966b5c58b0f76dd9d16b50bab19476b }
          execution: { version: 1, role: fixer, workspace: { access: write } }
          reviewCyclePhase: fix
        - id: re-review
          kind: AtomicStage
          capability: { id: skill:rasen-review, version: sha256:281717f5e3164dca91e21d9329ae812b8ee1263f656d605ef8b1d3d6bba0c7fc }
          execution: { version: 1, role: reviewer, workspace: { access: read } }
          reviewCyclePhase: re-review
      connections:
        - { id: review-to-triage, from: { node: review, port: findings }, to: { node: triage, port: start } }
        - { id: triage-to-fix, from: { node: triage, port: ready }, to: { node: fix, port: start } }
        - { id: fix-to-re-review, from: { node: fix, port: fixed }, to: { node: re-review, port: start } }
root:
  nodes:
    - id: office-hours
      kind: AtomicStage
      capability: { id: skill:rasen-office-hours-command, version: sha256:ff0bd82ad3aafe527fee2ff20bc6854e0dd1812b1bc47ac8f38f9489af31c4ab }
      execution: { version: 1, role: planner, workspace: { access: write } }
    - { id: gate:office-hours, kind: Gate, outcomes: [approved, rejected], dispositions: { approved: proceed, rejected: escalate }, target: office-hours }
    - id: propose
      kind: AtomicStage
      capability: { id: skill:rasen-propose, version: sha256:950fbdbff5734ef2760fc9c04d60399e43caaf869a7f24ba11ddcbb2d6bb1907 }
      execution: { version: 1, role: planner, workspace: { access: write }, leadReview: true }
    - { id: gate:propose, kind: Gate, outcomes: [approved, rejected], dispositions: { approved: proceed, rejected: escalate }, target: propose }
    - id: apply
      kind: AtomicStage
      capability: { id: skill:rasen-apply-change, version: sha256:dd1b0845380d232d173d7c28873738aff2a798defc13b83bf1041a39d6a6a79f }
      execution: { version: 1, role: implementer, workspace: { access: write } }
    - { id: gate:apply, kind: Gate, outcomes: [approved, rejected], dispositions: { approved: proceed, rejected: escalate }, target: apply }
    - id: experts
      kind: FanOut
      branches: [review, cso, benchmark, design-review, qa, qa-report-only]
      concurrencyCap: 3
      budget: 6
      joinNodeId: experts-join
      members:
        - { id: review, hierarchicalPath: review, required: true, condition: always }
        - { id: cso, hierarchicalPath: cso, required: false, condition: security-relevant }
        - { id: benchmark, hierarchicalPath: benchmark, required: false, condition: performance-sensitive }
        - { id: design-review, hierarchicalPath: design-review, required: false, condition: ui }
        - { id: qa, hierarchicalPath: qa, required: false, condition: ui }
        - { id: qa-report-only, hierarchicalPath: qa-report-only, required: false, condition: non-ui }
    - id: review
      kind: AtomicStage
      capability: { id: skill:rasen-review, version: sha256:281717f5e3164dca91e21d9329ae812b8ee1263f656d605ef8b1d3d6bba0c7fc }
      execution: { version: 1, role: reviewer, workspace: { access: read } }
    - id: cso
      kind: AtomicStage
      capability: { id: skill:rasen-cso, version: sha256:1f89c4fadfd9ad155f5af3e5835799201d347b9dbe2a670c0b076193ce219808 }
      execution: { version: 1, role: reviewer, workspace: { access: read } }
    - id: benchmark
      kind: AtomicStage
      capability: { id: skill:rasen-benchmark, version: sha256:34927b5d7713076287cad9cd71e03e0892efec7911080795d4294c9fe0e8ad1b }
      execution: { version: 1, role: reviewer, workspace: { access: read } }
    - id: design-review
      kind: AtomicStage
      capability: { id: skill:rasen-design-review, version: sha256:588c9a8901527e1cfb9b0f814f8759a79d063536126c13eddb3240de5ef79c52 }
      execution: { version: 1, role: reviewer, workspace: { access: read } }
    - id: qa
      kind: AtomicStage
      capability: { id: skill:rasen-qa, version: sha256:c7f0878f5a66889bf3da8ef6de125864bd71402fd0cd92817315f8a810acae87 }
      execution: { version: 1, role: reviewer, workspace: { access: read } }
    - id: qa-report-only
      kind: AtomicStage
      capability: { id: skill:rasen-qa, version: sha256:c7f0878f5a66889bf3da8ef6de125864bd71402fd0cd92817315f8a810acae87 }
      execution: { version: 1, role: reviewer, workspace: { access: read } }
    - id: experts-join
      kind: Join
      inputs: [review, cso, benchmark, design-review, qa, qa-report-only]
      requiredMembers: [review]
      optionalMembers: [cso, benchmark, design-review, qa, qa-report-only]
      outcomes: { proceed: experts-ready, failed: experts-failed }
    - id: review-loop
      kind: BoundedLoop
      body: review-cycle-body
      limits: { maxIterations: 3, maxActions: 48, budget: 48 }
      lifecycle:
        version: 1
        thresholds: { stallIterations: 2, sameBlockerAttempts: 3 }
        strategy:
          maxAttempts: 1
          requireMaterialChange: true
          capability: { id: skill:rasen-review-cycle, version: sha256:2689d5c85df54bf702f34337db8a51c90faf321d6c18b9e829f79dca89ea6e05 }
        exits:
          iterationLimit: { action: strategy }
          actionLimit: { action: fail, outcome: review-action-limit }
          budgetLimit: { action: fail, outcome: review-budget-limit }
          stalled: { action: strategy }
          blocked: { action: human-required, outcome: review-human-required }
          strategyExhausted: { action: fail, outcome: review-strategy-exhausted }
      exits:
        clean: { action: exit, outcome: review-clean }
        needs_fix: { action: continue }
    - id: ship
      kind: AtomicStage
      capability: { id: skill:rasen-ship, version: sha256:35615d0bfd09e3fadef419a6ba6f28fe15f278fa981ec3af45beaacc6be1d965 }
      execution: { version: 1, role: shipper, workspace: { access: write }, model: sonnet }
    - { id: gate:ship, kind: Gate, outcomes: [approved, rejected], dispositions: { approved: proceed, rejected: escalate }, target: ship }
    - id: retain
      kind: AtomicStage
      capability: { id: skill:rasen-retain, version: sha256:baa284d853a6153df7dcdca336b5d410bc987cd852c6aa2354f6218de8e3f66f }
      execution: { version: 1, role: reviewer, workspace: { access: write }, model: sonnet }
    - id: archive
      kind: AtomicStage
      capability: { id: skill:rasen-archive-change, version: sha256:bf36a873d7af835e3622da50a45e391aecc70b908ce9b51b19567c847b9dfdd8 }
      execution: { version: 1, role: shipper, workspace: { access: write }, model: sonnet }
    - { id: finish, kind: Finish, outcome: completed }
  connections:
    - { id: office-hours-to-propose, from: { node: office-hours, port: done }, to: { node: propose, port: start } }
    - { id: propose-to-apply, from: { node: propose, port: done }, to: { node: apply, port: start } }
    - { id: apply-to-experts, from: { node: apply, port: done }, to: { node: experts, port: start } }
    - { id: experts-to-review, from: { node: experts, port: review }, to: { node: review, port: start } }
    - { id: experts-to-cso, from: { node: experts, port: cso }, to: { node: cso, port: start } }
    - { id: experts-to-benchmark, from: { node: experts, port: benchmark }, to: { node: benchmark, port: start } }
    - { id: experts-to-design-review, from: { node: experts, port: design-review }, to: { node: design-review, port: start } }
    - { id: experts-to-qa, from: { node: experts, port: qa }, to: { node: qa, port: start } }
    - { id: experts-to-qa-report-only, from: { node: experts, port: qa-report-only }, to: { node: qa-report-only, port: start } }
    - { id: review-to-experts-join, from: { node: review, port: done }, to: { node: experts-join, port: review } }
    - { id: cso-to-experts-join, from: { node: cso, port: done }, to: { node: experts-join, port: cso } }
    - { id: benchmark-to-experts-join, from: { node: benchmark, port: done }, to: { node: experts-join, port: benchmark } }
    - { id: design-review-to-experts-join, from: { node: design-review, port: done }, to: { node: experts-join, port: design-review } }
    - { id: qa-to-experts-join, from: { node: qa, port: done }, to: { node: experts-join, port: qa } }
    - { id: qa-report-only-to-experts-join, from: { node: qa-report-only, port: done }, to: { node: experts-join, port: qa-report-only } }
    - { id: experts-join-to-review-loop, from: { node: experts-join, port: experts-ready }, to: { node: review-loop, port: start } }
    - { id: review-loop-to-ship, from: { node: review-loop, port: review-clean }, to: { node: ship, port: start } }
    - { id: ship-to-retain, from: { node: ship, port: done }, to: { node: retain, port: start } }
    - { id: retain-to-archive, from: { node: retain, port: done }, to: { node: archive, port: start } }
    - { id: archive-to-finish, from: { node: archive, port: done }, to: { node: finish, port: start } }
