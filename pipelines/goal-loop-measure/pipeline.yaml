version: 2
id: builtin:goal-loop-measure
sourceId: package:goal-loop-measure
name: goal-loop-measure
description: >-
  Goal-driven iteration for measurable code targets. A typed measure GoalLoop
  must satisfy its gate before the ship, retain, and archive tail is admitted.
inputs: []
artifacts: []
outcomes: [approved, rejected, completed]
limits: { maxActions: 64, budget: 64 }
declarations:
  - id: goal-cycle-body
    kind: Composite
    provenance: built-in
    inputs:
      - { name: start, type: ecp/control }
    artifacts: []
    outcomes: [clean, needs_fix]
    graph:
      nodes:
        - id: work
          kind: AtomicStage
          capability: { id: skill:rasen-goal-iterate, version: sha256:1b1a8566322f14a02994b3274f4256def710a77c95ec7927e58daaf948520a87 }
          execution: { version: 1, role: implementer, workspace: { access: write } }
          goalCyclePhase: work
        - id: judge
          kind: AtomicStage
          capability: { id: skill:rasen-goal-judge, version: sha256:2ae0f1918512979d732b3f1b881c85530cc1447ea53cabfd76811bf68e6f9b1e }
          execution: { version: 1, role: reviewer, workspace: { access: read } }
          goalCyclePhase: judge
      connections:
        - { id: work-to-judge, from: { node: work, port: ready }, to: { node: judge, port: start } }
root:
  nodes:
    - id: define-goal
      kind: AtomicStage
      capability: { id: skill:rasen-goal-plan, version: sha256:610dd104f26d8b622fe42cb0e25ea08c4678427f1188d3fe1e6dc05a44192463 }
      execution: { version: 1, role: planner, workspace: { access: write } }
    - { id: gate:define-goal, kind: Gate, outcomes: [approved, rejected], dispositions: { approved: proceed, rejected: escalate }, target: define-goal }
    - id: iterate
      kind: BoundedLoop
      body: goal-cycle-body
      goalCycleVariant: measure
      limits: { maxIterations: 5, maxActions: 40, budget: 40 }
      lifecycle:
        version: 1
        thresholds: { stallIterations: 2, sameBlockerAttempts: 3 }
        strategy:
          maxAttempts: 1
          requireMaterialChange: true
          capability: { id: skill:rasen-goal-iterate, version: sha256:1b1a8566322f14a02994b3274f4256def710a77c95ec7927e58daaf948520a87 }
        exits:
          iterationLimit: { action: strategy }
          actionLimit: { action: fail, outcome: goal-action-limit }
          budgetLimit: { action: fail, outcome: goal-budget-limit }
          stalled: { action: strategy }
          blocked: { action: human-required, outcome: goal-human-required }
          strategyExhausted: { action: fail, outcome: goal-strategy-exhausted }
      exits:
        clean: { action: exit, outcome: goal-satisfied }
        needs_fix: { action: continue }
    - id: ship
      kind: AtomicStage
      capability: { id: skill:rasen-ship, version: sha256:35615d0bfd09e3fadef419a6ba6f28fe15f278fa981ec3af45beaacc6be1d965 }
      execution: { version: 1, role: shipper, workspace: { access: write }, model: sonnet }
    - { id: gate:ship, kind: Gate, outcomes: [approved, rejected], dispositions: { approved: proceed, rejected: escalate }, target: ship }
    - id: retain
      kind: AtomicStage
      capability: { id: skill:rasen-retain, version: sha256:baa284d853a6153df7dcdca336b5d410bc987cd852c6aa2354f6218de8e3f66f }
      execution: { version: 1, role: reviewer, workspace: { access: write }, model: sonnet }
    - id: archive
      kind: AtomicStage
      capability: { id: skill:rasen-archive-change, version: sha256:4883a8d8e4c61343c87e3e0bdd194bc5d48e8b4cbc7ded32738b7652bec93b13 }
      execution: { version: 1, role: shipper, workspace: { access: write }, model: sonnet }
    - { id: finish, kind: Finish, outcome: completed }
  connections:
    - { id: define-goal-to-iterate, from: { node: define-goal, port: done }, to: { node: iterate, port: start } }
    - { id: iterate-to-ship, from: { node: iterate, port: goal-satisfied }, to: { node: ship, port: start } }
    - { id: ship-to-retain, from: { node: ship, port: done }, to: { node: retain, port: start } }
    - { id: retain-to-archive, from: { node: retain, port: done }, to: { node: archive, port: start } }
    - { id: archive-to-finish, from: { node: archive, port: done }, to: { node: finish, port: start } }
