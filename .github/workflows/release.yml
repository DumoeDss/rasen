name: Release

on:
  push:
    tags:
      - 'rasen-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build CLI and UI release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/ui/pnpm-lock.yaml

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Install UI dependencies
        run: pnpm --dir packages/ui install --frozen-lockfile

      - name: Validate lockstep versions and prepare release notes
        run: node scripts/release-contract.mjs --tag "${GITHUB_REF_NAME}" --notes-output "${RUNNER_TEMP}/release-notes.md"

      - name: Test CLI
        run: pnpm test

      - name: Build CLI
        run: pnpm build

      - name: Typecheck UI
        run: pnpm --dir packages/ui typecheck

      - name: Test UI
        run: pnpm --dir packages/ui test

      - name: Build UI
        run: pnpm --dir packages/ui build

      - name: Verify paired package contents
        run: pnpm check:paired-pack

      - name: Pack CLI
        run: |
          mkdir -p "${RUNNER_TEMP}/release-assets"
          npm pack --pack-destination "${RUNNER_TEMP}/release-assets"

      - name: Pack UI
        working-directory: packages/ui
        run: npm pack --pack-destination "${RUNNER_TEMP}/release-assets"

      - name: Upload paired tarballs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ runner.temp }}/release-assets/*.tgz

  notify-site:
    name: Notify rasen-site
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dispatch release-published event
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.RASEN_SITE_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          payload="$(node -e 'process.stdout.write(JSON.stringify({event_type:"rasen-release-published",client_payload:{tag:process.env.RELEASE_TAG,source_repository:process.env.SOURCE_REPOSITORY,source_run_url:process.env.SOURCE_RUN_URL,release_url:process.env.RELEASE_URL}}))')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${SITE_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            https://api.github.com/repos/DumoeDss/rasen-site/dispatches

  publish-npm:
    name: Publish CLI and UI to npm
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for NPM_TOKEN
        id: token_check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::npm publish skipped for both @atelierai/rasen and @atelierai/rasen-ui — NPM_TOKEN not set"
          fi

      - name: Setup pnpm
        if: steps.token_check.outputs.present == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.token_check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/ui/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install CLI dependencies
        if: steps.token_check.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install UI dependencies
        if: steps.token_check.outputs.present == 'true'
        run: pnpm --dir packages/ui install --frozen-lockfile

      - name: Validate lockstep release contract
        if: steps.token_check.outputs.present == 'true'
        run: node scripts/release-contract.mjs --tag "${GITHUB_REF_NAME}"

      - name: Build CLI
        if: steps.token_check.outputs.present == 'true'
        run: pnpm build

      - name: Build UI
        if: steps.token_check.outputs.present == 'true'
        run: pnpm --dir packages/ui build

      - name: Publish CLI package
        if: steps.token_check.outputs.present == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish UI package
        if: steps.token_check.outputs.present == 'true'
        working-directory: packages/ui
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
