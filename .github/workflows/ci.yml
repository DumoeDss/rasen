name: CI

on:
  pull_request:
    branches: [main, 'dev/**']
  merge_group:
    branches: [main, 'dev/**']
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which files changed to enable path-based filtering
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Nix-related changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'scripts/update-flake.sh'
              - '.github/workflows/ci.yml'

  test_matrix:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            label: linux-bash
            node: '20.19.0'
            vitest_workers: 4
            timeout_minutes: 15
            vitest_partition: ''
          - os: macos-latest
            shell: bash
            label: macos-bash
            node: '20.19.0'
            vitest_workers: 4
            timeout_minutes: 15
            vitest_partition: ''
          - os: windows-latest
            shell: pwsh
            label: windows-pwsh-shard-1
            node: '20.19.0'
            vitest_workers: 2
            timeout_minutes: 20
            vitest_partition: '1/3'
          - os: windows-latest
            shell: pwsh
            label: windows-pwsh-shard-2
            node: '20.19.0'
            vitest_workers: 2
            timeout_minutes: 20
            vitest_partition: '2/3'
          - os: windows-latest
            shell: pwsh
            label: windows-pwsh-shard-3
            node: '20.19.0'
            vitest_workers: 2
            timeout_minutes: 20
            vitest_partition: '3/3'
          - os: ubuntu-latest
            shell: bash
            label: linux-bash-node24
            node: '24.x'
            vitest_workers: 4
            timeout_minutes: 15
            vitest_partition: ''

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Print environment diagnostics
        run: |
          node -p "JSON.stringify({ platform: process.platform, arch: process.arch, shell: process.env.SHELL || process.env.ComSpec || '' })"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Run tests
        if: matrix.vitest_partition == ''
        env:
          VITEST_MAX_WORKERS: ${{ matrix.vitest_workers }}
        run: pnpm test

      - name: Run tests (partition ${{ matrix.vitest_partition }})
        if: matrix.vitest_partition != ''
        env:
          VITEST_MAX_WORKERS: ${{ matrix.vitest_workers }}
          VITEST_FILE_PARTITION: ${{ matrix.vitest_partition }}
        run: pnpm test

      - name: Run focused Windows server-local path and UI path tests
        if: matrix.label == 'windows-pwsh-shard-1'
        run: |
          pnpm --dir packages/ui install --frozen-lockfile
          pnpm exec vitest run test/core/management-api/local-path-resolver.test.ts test/core/management-api/local-path-chooser.test.ts test/core/management-api/create-space.test.ts
          pnpm --dir packages/ui exec vitest run test/components/local-path-picker.test.tsx test/components/spaces-page.test.tsx test/components/workflows-page.test.tsx test/components/pipelines-page.test.tsx

      - name: Upload test coverage
        if: matrix.label == 'linux-bash'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.event_name }}
          path: coverage/
          retention-days: 7

  file_placement_recovery:
    name: File placement recovery (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            label: linux-node-floor
          - os: macos-latest
            shell: bash
            label: macos-node-floor
          - os: windows-latest
            shell: pwsh
            label: windows-node-floor

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js floor
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Run native file-placement recovery matrix
        env:
          VITEST_MAX_WORKERS: 1
        run: >-
          pnpm exec vitest run
          test/core/archive-engine.test.ts
          test/core/archive-fault-matrix.test.ts
          test/core/archive-path-semantics.test.ts
          test/core/archive-accounting.test.ts
          test/core/archive-ephemera.test.ts
          test/core/ephemera-cleaner.test.ts

  test_pr_required:
    name: Test
    runs-on: ubuntu-latest
    needs: [test_matrix, file_placement_recovery]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    steps:
      - name: Verify matrix tests passed
        run: |
          if [[ "${{ needs.test_matrix.result }}" != "success" ]]; then
            echo "Matrix test job failed"
            exit 1
          fi
          if [[ "${{ needs.file_placement_recovery.result }}" != "success" ]]; then
            echo "Native file-placement recovery job failed"
            exit 1
          fi
          echo "All general and native recovery matrix tests passed!"

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Check for whitespace errors in diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'HEAD~1' }}
        run: git diff --check "${BASE_SHA}...HEAD"

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Check for build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          if [ ! -f "dist/cli/index.js" ]; then
            echo "Error: CLI entry point not found"
            exit 1
          fi

  ui_build:
    name: UI Package Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'
          cache-dependency-path: packages/ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Verify dist/index.html exists
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: packages/ui/dist/index.html not found after build"
            exit 1
          fi

  nix-flake-validate:
    name: Nix Flake Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build with Nix
        run: nix build

      - name: Verify build output
        run: |
          if [ ! -e "result" ]; then
            echo "Error: Nix build output 'result' symlink not found"
            exit 1
          fi
          if [ ! -f "result/bin/rasen" ]; then
            echo "Error: rasen binary not found in build output"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Test binary execution
        run: |
          VERSION=$(nix run . -- --version)
          echo "rasen version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "Error: Version command returned empty output"
            exit 1
          fi
          echo "✅ Binary execution successful"

      - name: Validate update script
        run: |
          echo "Testing update-flake.sh script..."
          bash scripts/update-flake.sh
          echo "✅ Update script executed successfully"

      - name: Check flake.nix modifications
        run: |
          if git diff --quiet flake.nix; then
            echo "ℹ️  flake.nix unchanged (hash already up-to-date)"
          else
            echo "✅ flake.nix was updated by script"
            git diff flake.nix
          fi

      - name: Restore flake.nix
        if: always()
        run: git checkout -- flake.nix || true

  required-checks-pr:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [test_matrix, file_placement_recovery, lint, ui_build, nix-flake-validate]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ needs.test_matrix.result }}" != "success" ]]; then
            echo "Matrix test job failed"
            exit 1
          fi
          if [[ "${{ needs.file_placement_recovery.result }}" != "success" ]]; then
            echo "Native file-placement recovery job failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.ui_build.result }}" != "success" ]]; then
            echo "UI package build job failed"
            exit 1
          fi
          # Nix validation may be skipped if no Nix-related files changed
          if [[ "${{ needs.nix-flake-validate.result }}" != "success" && "${{ needs.nix-flake-validate.result }}" != "skipped" ]]; then
            echo "Nix flake validation job failed"
            exit 1
          fi
          if [[ "${{ needs.nix-flake-validate.result }}" == "skipped" ]]; then
            echo "Nix flake validation skipped (no Nix-related changes)"
          fi
          echo "All required checks passed!"

  required-checks-main:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [test_matrix, file_placement_recovery, lint, ui_build, nix-flake-validate]
    if: always() && github.event_name == 'push'
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ needs.test_matrix.result }}" != "success" ]]; then
            echo "Matrix test job failed"
            exit 1
          fi
          if [[ "${{ needs.file_placement_recovery.result }}" != "success" ]]; then
            echo "Native file-placement recovery job failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.ui_build.result }}" != "success" ]]; then
            echo "UI package build job failed"
            exit 1
          fi
          # Nix validation may be skipped if no Nix-related files changed
          if [[ "${{ needs.nix-flake-validate.result }}" != "success" && "${{ needs.nix-flake-validate.result }}" != "skipped" ]]; then
            echo "Nix flake validation job failed"
            exit 1
          fi
          if [[ "${{ needs.nix-flake-validate.result }}" == "skipped" ]]; then
            echo "Nix flake validation skipped (no Nix-related changes)"
          fi
          echo "All required checks passed!"
